# Site settings — change these to match your real GitHub account / repo name.
site_name: Congo's Mods Wiki
site_description: Documentation for Congo's mods.
site_url: https://therealcongo.github.io/CongosMods/
repo_url: https://github.com/TheRealCongo/CongosMods
repo_name: CongosMods
edit_uri: edit/main/docs/   # adds a pencil "edit this page" button for people with repo access

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: lime
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant     # fast page switching
    - navigation.tracking
    - navigation.sections    # groups pages in the sidebar
    - navigation.indexes
    - navigation.top         # "back to top" button
    - navigation.footer      # previous / next links
    - search.suggest
    - search.highlight
    - toc.follow
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

markdown_extensions:
  - tables
  - admonition             # !!! note / warning / tip boxes
  - pymdownx.details       # collapsible ??? boxes
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list              # { width="400" } on images
  - md_in_html             # captions around images
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

# Sidebar order. Add each new page here.
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Mods:
      - mods/index.md
      - Dynamic Lights: mods/dynamic-lights.md
      - Mission Architect: mods/mission-architect.md
      - Tactical Deployables: mods/tactical-deployables.md
      - Weather System: mods/weather-system.md
      - Weather System - Desert: mods/weather-system-desert.md
      - Example Mod: mods/example-mod.md
  - FAQ: faq.md
