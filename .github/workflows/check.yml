# Runs on every pull request: makes sure the wiki still builds with no broken links or bad pages.
# main is protected and requires this check ("Build check") to pass before a PR can merge.
name: Build check

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-check:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
